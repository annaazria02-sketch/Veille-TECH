<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Tech & Défense — monde</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#5b6573;--bd:#dde1e7;--acc:#1f6feb;--def:#b4541a;--chip:#e8ebf0}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mut:#8b96a5;--bd:#2a313c;--acc:#58a6ff;--def:#f0883e;--chip:#222a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,.bar,main,footer{max-width:1100px;margin:auto;padding-left:16px;padding-right:16px}
header{padding-top:20px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}h1 span{color:var(--def)}
#live{color:var(--mut);font-size:.85rem}
#live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2da44e;margin-right:6px;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.bar{padding-top:10px;padding-bottom:4px;display:grid;gap:8px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row b{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-right:4px}
button.chip{border:0;background:var(--chip);color:var(--tx);padding:6px 12px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
button.chip.on{background:var(--acc);color:#fff}
main{padding-top:10px;padding-bottom:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card.new{border-left:4px solid var(--acc)}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.tag.defense,.tag.space{color:var(--def)}
.card h2{margin:0;font-size:1.02rem;line-height:1.3}
.card h2 a{color:inherit;text-decoration:none}.card h2 a:hover{color:var(--acc)}
.card p{margin:0;color:var(--mut);font-size:.9rem}
.meta{margin-top:auto;font-size:.8rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
footer{color:var(--mut);font-size:.78rem;padding-bottom:30px}
</style>
</head>
<body>
<header>
  <h1>Veille <span>Tech</span> & Défense — monde</h1>
  <div id="live"><i></i><span id="upd">chargement…</span></div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Rechercher (drones, Anduril, hypersonique, puces…)">
  <div class="row" id="cats"><b>Thème</b></div>
  <div class="row" id="regs"><b>Région</b></div>
</div>
<main id="grid"></main>
<footer>Titres et extraits courts fournis par les flux RSS des éditeurs ; cliquez pour lire l’article complet sur le site d’origine. Actualisation automatique toutes les 60 s.</footer>
<script>
const CATS={all:"Tout",defense:"Défense",space:"Spatial",cyber:"Cyber",ai:"IA",tech:"Tech"};
const REGS={all:"Monde",US:"États-Unis",EU:"Europe",FR:"France",UK:"Royaume-Uni",ASIA:"Asie",MENA:"Moyen-Orient",GLOBAL:"International"};
const st={cat:"all",region:"all",q:""}; let firstLoad=true, seen=new Set();
const $=id=>document.getElementById(id);
const chips=(el,map,key)=>{el.insertAdjacentHTML("beforeend",Object.entries(map).map(([k,v])=>`<button class="chip${st[key]===k?" on":""}" data-k="${k}">${v}</button>`).join(""));
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[key]=b.dataset.k;el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.k===b.dataset.k));load()}};
chips($("cats"),CATS,"cat");chips($("regs"),REGS,"region");
let t;$("q").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value;load()},250)};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function ago(d){const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));return m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`}
async function load(){
  try{
    const p=new URLSearchParams({cat:st.cat,region:st.region,q:st.q,limit:120});
    const r=await (await fetch("/api/news?"+p)).json();
    $("upd").textContent=r.updated?`mis à jour ${ago(r.updated)} · ${r.count} articles`:"première récupération en cours…";
    $("grid").innerHTML=r.items.length?r.items.map(n=>{
      const isNew=!firstLoad&&!seen.has(n.url);
      return `<article class="card${isNew?" new":""}"><span class="tag ${n.cat}">${CATS[n.cat]||n.cat} · ${REGS[n.region]||n.region}${n.lang!=="en"?" · "+n.lang.toUpperCase():""}${isNew?" · NOUVEAU":""}</span>
      <h2><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></h2>${n.summary?`<p>${esc(n.summary)}</p>`:""}
      <div class="meta"><span>${esc(n.source)}</span><span>${ago(n.date)}</span></div></article>`}).join(""):'<div class="empty">Aucun article pour l’instant.</div>';
    r.items.forEach(n=>seen.add(n.url));firstLoad=false;
  }catch(e){$("upd").textContent="serveur injoignable"}
}
load();setInterval(load,60000);
</script>
</body>
</html>
