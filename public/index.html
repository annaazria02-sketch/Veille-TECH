<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille Tech & Défense — monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ice:#e6f0f8;--ice2:#d3e3f1;--ink:#0b1630;--mut:#4d5b75;--verm:#e8381f;--line:rgba(11,22,48,.14)}
*{box-sizing:border-box}
html{background:var(--ice)}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,var(--ice) 0%,var(--ice2) 100%) fixed;
  font:16px/1.5 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* Ombre de chasseur */
.jet{position:fixed;right:-10vw;top:6vh;width:min(95vw,860px);aspect-ratio:1;z-index:0;pointer-events:none;
  transform:rotate(32deg);opacity:.085;filter:blur(1.2px)}
.jet svg{width:100%;height:100%;display:block}
header,.bar,main,footer{position:relative;z-index:1;max-width:1120px;margin:auto;padding-left:20px;padding-right:20px}

header{padding-top:36px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:-.035em;line-height:1}
h1 i{display:inline-block;width:.32em;height:.32em;background:var(--verm);margin-right:.35em;vertical-align:.08em}
#live{font-size:.8rem;color:var(--mut);font-weight:500}
#live b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verm);margin-right:7px;animation:p 2s infinite}
@keyframes p{50%{opacity:.25}}

.bar{padding-top:18px;padding-bottom:6px;display:grid;gap:14px}
input{width:100%;padding:12px 14px;border:1px solid var(--ink);border-radius:0;background:rgba(255,255,255,.7);color:var(--ink);font:inherit;outline:0}
input:focus{box-shadow:0 0 0 2px var(--verm)}
input::placeholder{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.row span{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);min-width:54px}
button.chip{border:0;background:none;padding:4px 0;font:inherit;font-size:.9rem;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
button.chip:hover{color:var(--ink)}
button.chip.on{color:var(--ink);border-bottom-color:var(--verm)}

main{padding-top:16px;padding-bottom:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:rgba(238,245,251,.82);border:1px solid var(--line);border-top:2px solid var(--ink);padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;transition:background .15s}
.card:hover{background:rgba(255,255,255,.95)}
.tag{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--verm)}
.tag em{font-style:normal;color:var(--mut);font-weight:600}
.card h2{margin:0;font-size:1.04rem;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{text-decoration:underline;text-decoration-color:var(--verm);text-decoration-thickness:2px;text-underline-offset:3px}
.card p{margin:0;color:var(--mut);font-size:.88rem}
.meta{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:.76rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px;font-weight:500}
.card.new{border-top-color:var(--verm)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px}
footer{color:var(--mut);font-size:.74rem;padding-bottom:36px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="jet" aria-hidden="true">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <path fill="#0b1630" d="M200 8C206 40 212 72 214 112L224 150 338 262 341 293 238 288 233 311 277 350 277 367 219 357 212 386 200 394 188 386 181 357 123 367 123 350 167 311 162 288 59 293 62 262 176 150 186 112C188 72 194 40 200 8Z"/>
    <path fill="#e6f0f8" d="M200 52C206 52 209 70 209 90 209 104 205 112 200 112 195 112 191 104 191 90 191 70 194 52 200 52Z" opacity=".55"/>
  </svg>
</div>

<header>
  <h1><i></i>Veille Tech &amp; Défense</h1>
  <div id="live"><b></b><span id="upd">chargement…</span></div>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Rechercher : drones, Anduril, hypersonique, puces…">
  <div class="row" id="cats"><span>Thème</span></div>
  <div class="row" id="regs"><span>Région</span></div>
</div>

<main id="grid"></main>
<footer>Titres et courts extraits fournis par les flux RSS des éditeurs ; cliquez pour lire l’article complet sur le site d’origine. Actualisation automatique toutes les 60 secondes.</footer>

<script>
const CATS={all:"Tout",defense:"Défense",space:"Spatial",cyber:"Cyber",ai:"IA",tech:"Tech"};
const REGS={all:"Monde",US:"États-Unis",EU:"Europe",FR:"France",UK:"Royaume-Uni",ASIA:"Asie",MENA:"Moyen-Orient",GLOBAL:"International"};
const st={cat:"all",region:"all",q:""}; let firstLoad=true, seen=new Set();
const $=id=>document.getElementById(id);
const chips=(el,map,key)=>{el.insertAdjacentHTML("beforeend",Object.entries(map).map(([k,v])=>`<button class="chip${st[key]===k?" on":""}" data-k="${k}">${v}</button>`).join(""));
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[key]=b.dataset.k;el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.k===b.dataset.k));load()}};
chips($("cats"),CATS,"cat");chips($("regs"),REGS,"region");
let t;$("q").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value;load()},250)};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function ago(d){const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));return m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`}
async function load(){
  try{
    const p=new URLSearchParams({cat:st.cat,region:st.region,q:st.q,limit:120});
    const r=await (await fetch("/api/news?"+p)).json();
    $("upd").textContent=r.updated?`Mis à jour ${ago(r.updated)} · ${r.count} articles`:"Première récupération en cours…";
    $("grid").innerHTML=r.items.length?r.items.map(n=>{
      const isNew=!firstLoad&&!seen.has(n.url);
      return `<article class="card${isNew?" new":""}"><span class="tag">${CATS[n.cat]||n.cat} <em>/ ${REGS[n.region]||n.region}${n.lang!=="en"?" / "+n.lang.toUpperCase():""}</em>${isNew?" · NOUVEAU":""}</span>
      <h2><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></h2>${n.summary?`<p>${esc(n.summary)}</p>`:""}
      <div class="meta"><span>${esc(n.source)}</span><span>${ago(n.date)}</span></div></article>`}).join(""):'<div class="empty">Aucun article pour l’instant.</div>';
    r.items.forEach(n=>seen.add(n.url));firstLoad=false;
  }catch(e){$("upd").textContent="Serveur injoignable"}
}
load();setInterval(load,60000);
</script>
</body>
</html>
